services:
  # Service 1: Application Server (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - laravel-network

  # Service 2: Web Server (Nginx)
  nginx:
    image: nginx:1.21-alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80" # Ánh xạ cổng 8000 của máy bạn vào cổng 80 của container
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-network

  # Service 3: Database (MySQL)
  db:
      image: mysql:8.0
      container_name: laravel_db
      restart: unless-stopped
      environment:
        # TZ vẫn có thể giữ lại, nó không gây hại, nhưng không phải là cách chính
        TZ: Asia/Ho_Chi_Minh 
        MYSQL_DATABASE: ${DB_DATABASE:-laravel}
        MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
        MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
        MYSQL_USER: ${DB_USERNAME:-user}
      # === THÊM BLOCK 'command' NÀY VÀO ===
      command: --default-authentication-plugin=mysql_native_password --default-time-zone='+07:00'
      # ====================================
      volumes:
        - db-data:/var/lib/mysql
      ports:
        - "33066:3306"
      networks:
        - laravel-network

  # === THÊM SERVICE PHPMYADMIN DƯỚI ĐÂY ===
  phpmyadmin:
    image: phpmyadmin
    container_name: laravel_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80" # Truy cập phpMyAdmin qua cổng 8081
    environment:
      PMA_HOST: db # QUAN TRỌNG: trỏ đến tên service 'db'
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root} # Cung cấp mật khẩu root để đăng nhập
      UPLOAD_LIMIT: 512M # Tăng giới hạn upload file SQL
    depends_on:
      - db # Phải khởi động sau khi database đã sẵn sàng
    networks:
      - laravel-network

  node:
    image: node:18-alpine
    container_name: laravel_node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    # === THÊM BLOCK ENVIRONMENT VÀO ĐÂY ===
    environment:
      - VITE_ORIGIN=http://localhost:5173
    # ======================================
    command: sh -c "npm install && npm run dev"
    networks:
      - laravel-network

# Định nghĩa network chung
networks:
  laravel-network:
    driver: bridge

# Định nghĩa volume để lưu dữ liệu database
volumes:
  db-data:
    driver: local